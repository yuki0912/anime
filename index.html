<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Anime — 自訂網站範本</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo">Anime</h1>
      <nav>
        <a href="#home">Home</a>
        <a href="#gallery">Gallery</a>
        <a href="#about">About</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="home" class="hero">
      <div class="container">
        <h2>歡迎來到你的 Anime 主題網站</h2>
        <p>這是一個可自訂的靜態範本：更換文字、配色、圖片，或加入新頁面即可。</p>
        <a class="btn" id="cta">開始自訂</a>
      </div>
    </section>

    <section id="gallery" class="gallery container">
      <h3>作品牆</h3>
      <div class="grid" id="gallery-grid">
        <!-- 範例項目，由 script.js 動態加入 -->
      </div>
    </section>

    <section id="about" class="about container">
      <h3>關於此網站</h3>
      <p>由 yuki0912/anime 的網站樣板快速建立。想要更多功能（例如：部落格、搜尋、會員）請告訴我你的需求，我會幫你加入。</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 Anime — 自訂網站範本</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
