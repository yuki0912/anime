<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Image Gallery</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
      background: #0f0f0f;
      color: #e0e0e0;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    p {
      color: #888;
      margin-bottom: 32px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 12px 0;
    }
    a {
      display: inline-block;
      padding: 10px 20px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 6px;
      color: #c9a0ff;
      text-decoration: none;
      font-size: 1rem;
      transition: background 0.2s;
    }
    a:hover {
      background: #2a2a2a;
    }
  </style>
</head>
<body>
  <h1>🖼 Anime Image Gallery</h1>
  <p>Browse images by category:</p>

    <li><a href="/arknight/">Arknights</a></li>
    <li><a href="/pjsk/">Project Sekai (pjsk)</a></li>

</html>
