<body>
  <header>
    <h1>Image Gallery</h1>
  </header>
  <nav id="tabs"></nav>
  <div class="count" id="count"></div>
  <div class="gallery" id="gallery"></div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">&#x2715;</button>
    <img id="lightbox-img" src="" alt="" />
    <div class="lightbox-nav">
      <button onclick="navigate(-1)">&#8592; Prev</button>
      <button onclick="navigate(+2)">up &#8594;</button>
      <button onclick="navigate(1)">Next &#8594;</button>
    </div>
  </div>

  <script>
    const categories = {
      "Arknights": [],
      "Project Sekai": [],
      "照片": [],
      "圖片": [],
    };

   fetch('images.json')
      .then(r => r.json())
      .then(data => {
        Object.keys(categories).forEach(k => categories[k] = []);
        Object.assign(categories, data);
        buildTabs();
        
        const firstPopulated = Object.keys(categories).find(cat => categories[cat].length > 0);
        showCategory(firstPopulated || Object.keys(categories)[0]);
      })
      .catch(err => console.error("載入 images.json 失敗:", err));

    let currentCategory = '';
    let currentIndex = 0;

    function buildTabs() {
      const nav = document.getElementById('tabs');
      nav.innerHTML = ''; // 確保重複呼叫時不會疊加
      Object.keys(categories).forEach((cat) => {
        const btn = document.createElement('button');
        btn.textContent = `${cat} (${categories[cat].length})`;
        btn.onclick = () => showCategory(cat);
        btn.id = `tab-${cat}`;
        nav.appendChild(btn);
      });
    }

    function showCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      const tab = document.getElementById(`tab-${cat}`);
      if (tab) tab.classList.add('active');

      const imgs = categories[cat] || [];
      document.getElementById('count').textContent = `${imgs.length} image${imgs.length !== 1 ? 's' : ''}`;
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';
      imgs.forEach((src, idx) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.innerHTML = `<img src="${src}" loading="lazy" alt="" /><div class="label">${src.split('/').pop()}</div>`;
        item.onclick = () => openLightbox(idx);
        gallery.appendChild(item);
      });
    }

    function openLightbox(idx) {
      const imgs = categories[currentCategory];
      if (!imgs || imgs.length === 0) return; // 防呆：無圖片時不執行

      currentIndex = idx;
      document.getElementById('lightbox-img').src = imgs[idx];
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    function navigate(dir) {
      const imgs = categories[currentCategory];
      if (!imgs || imgs.length === 0) return; // 防呆：無圖片時不執行

      currentIndex = (currentIndex + dir + imgs.length) % imgs.length;
      document.getElementById('lightbox-img').src = imgs[currentIndex];
    }

    document.getElementById('lightbox').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeLightbox();
    });

    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') navigate(1);
      if (e.key === 'ArrowLeft') navigate(-1);
    });
  </script>
</body>
</html>
